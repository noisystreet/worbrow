name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · deny · machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::cognitive_complexity

      - name: test
        run: cargo test

      - name: deny (licenses / advisories / bans)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: machete (unused dependencies)
        uses: bnjbvr/cargo-machete@main

  msrv:
    # 验证声明的最低 Rust 版本（Cargo.toml rust-version = 1.97）确实可编译
    name: MSRV (1.97) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: check (all features, --locked)
        run: cargo check --all-features --locked

  smoke:
    # 真机冒烟：系统预装 Firefox/Chrome 跑协议回归（tests/*_smoke.rs 的 #[ignore]
    # 测试，--ignored 强制；仅访问 data:/about:/127.0.0.1，不依赖外网）。
    # 浏览器进程计数断言要求串行：--test-threads=1（同一 test binary 内）。
    name: real-browser smoke (firefox + chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: smoke (ignored real-browser tests)
        run: cargo test --test firefox_smoke --test cdp_smoke -- --ignored --test-threads=1

  deb:
    name: deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-deb

      - name: build deb
        run: cargo deb

      - name: verify deb
        run: |
          DEB=$(ls target/debian/*.deb | head -n1)
          dpkg-deb --info "$DEB" | sed -n '1,20p'
          dpkg-deb --contents "$DEB" | grep -q '/usr/bin/worbrow'
          echo "deb OK: $DEB"
