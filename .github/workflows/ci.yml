name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · deny · machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test

      - name: deny (licenses / advisories / bans)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: machete (unused dependencies)
        uses: bnjbvr/cargo-machete@main

  deb:
    name: deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-deb

      - name: build deb
        run: cargo deb --features mcp

      - name: verify deb
        run: |
          DEB=$(ls target/debian/*.deb | head -n1)
          dpkg-deb --info "$DEB" | sed -n '1,20p'
          dpkg-deb --contents "$DEB" | grep -q '/usr/bin/worbrow'
          echo "deb OK: $DEB"
