[package]
name = "worbrow"
version = "0.2.0"
edition = "2024"
description = "Agent 搜索 CLI：驱动本机 headless 浏览器（Chrome/Edge/Firefox）执行通用搜索引擎搜索，输出稳定 JSON 契约"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noisystreet/worbrow"
documentation = "https://docs.rs/worbrow"
readme = "README.md"
keywords = ["search", "headless-browser", "cdp", "marionette", "mcp"]
categories = ["command-line-utilities", "web-programming"]
authors = ["noisystreet <10571173+noisystreet@users.noreply.github.com>"]
rust-version = "1.97"

# 库目标：核心逻辑以 lib 暴露，供集成测试与后续扩展（如 HTTP 服务）复用
[lib]
name = "worbrow"
path = "src/lib.rs"

# 二进制名与设计文档 CLI 保持一致（`worbrow "..." --json`）
[[bin]]
name = "worbrow"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.33"
rmcp = { version = "2.2.0", features = ["schemars", "transport-io"], optional = true }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "net", "io-util", "sync"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
# default-features = false 去掉 tracing-log 桥接：项目不使用 log crate，且 LogTracer 是
# 进程级单例（log::set_logger 二次设置会 panic），去除后 fmt().init() 不再安装 LogTracer，
# 库被嵌入已初始化 tracing 的应用时无二次 init 风险
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std", "smallvec"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
pretty_assertions = "1.4.1"

[features]
# MCP 服务器（stdio）支持：`worbrow mcp` 子命令；默认启用
default = ["mcp"]
mcp = ["dep:rmcp"]

# Debian 打包（`make deb` / CI，cargo-deb 3.x）：发布形态启用 mcp feature
[package.metadata.deb]
maintainer = "noisystreet <10571173+noisystreet@users.noreply.github.com>"
section = "utils"
priority = "optional"
# 运行时需任一浏览器（Chrome/Edge 亦可，故为弱依赖）
recommends = "firefox | firefox-esr"

# 依赖审计：tokio-tungstenite 已被 CDP 后端（drivers/cdp.rs）实际使用，无需 ignore

# 安全基线：依赖树许可与漏洞检查（cargo-deny）
[package.metadata.deny]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
