[package]
name = "rplay-search"
version = "0.1.0"
edition = "2024"
description = "Agent 搜索 CLI：驱动本机 headless 浏览器（Chrome/Edge/Firefox）执行通用搜索引擎搜索，输出稳定 JSON 契约"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/rplay-search" # TODO: 设置真实仓库地址
rust-version = "1.85"

# 库目标：核心逻辑以 lib 暴露，供集成测试与后续扩展（如 HTTP 服务）复用
[lib]
name = "rplay_search"
path = "src/lib.rs"

# 二进制名与设计文档 CLI 保持一致（`search "..." --json`）
[[bin]]
name = "search"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "net", "io-util", "sync"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
pretty_assertions = "1.4.1"

# 安全基线：依赖树许可与漏洞检查（cargo-deny）
[package.metadata.deny]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
