[package]
name = "worbrow"
version = "0.2.4"
edition = "2024"
description = "Agent search CLI: drives local headless browsers (Chrome/Firefox, self-built CDP/Marionette) to search the web with a stable JSON contract; native MCP tools (web_search / fetch_page)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noisystreet/worbrow"
documentation = "https://docs.rs/worbrow"
readme = "README.md"
keywords = ["search", "headless-browser", "cdp", "marionette", "mcp"]
categories = ["command-line-utilities", "web-programming"]
authors = ["noisystreet <10571173+noisystreet@users.noreply.github.com>"]
rust-version = "1.97"

# 库目标：核心逻辑以 lib 暴露，供集成测试与后续扩展（如 HTTP 服务）复用
[lib]
name = "worbrow"
path = "src/lib.rs"

# 二进制名与设计文档 CLI 保持一致（`worbrow "..." --json`）
[[bin]]
name = "worbrow"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
base64 = "0.23.1"
# default-features = false：仅保留 serde（契约序列化）与 clock（Utc::now）；
# 去掉默认的 oldtime（遗留兼容）与 wasmbind（wasm 专属，原生编译无收益）
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
# default-features = false 去掉 color（anstream 家族）：帮助/错误输出改为无色，
# tracing-subscriber 的 ansi 仍用 anstyle 上色 stderr 日志；suggestions 保留（strsim
# 已被 darling 共享，裁不掉）
clap = { version = "4.6.4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
futures-util = "0.3.33"
rmcp = { version = "3.2.0", features = ["schemars", "transport-io"], optional = true }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "net", "io-util", "sync"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
# default-features = false 去掉 tracing-log 桥接：项目不使用 log crate，且 LogTracer 是
# 进程级单例（log::set_logger 二次设置会 panic），去除后 fmt().init() 不再安装 LogTracer，
# 库被嵌入已初始化 tracing 的应用时无二次 init 风险；env-filter 一并去掉：日志级别只用
# 静态 LevelFilter（main.rs），省去 matchers/regex-automata/regex-syntax 编译大户
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std", "smallvec"] }
# 静态 SERP HTTP GET（ADR-011/015）：ureq 阻塞客户端（spawn_blocking 包裹），HTTP 客户端
# 依赖闭包远小于 reqwest（~135 → ~30 个 crate）；charset 不启用：原实现即
# bytes + from_utf8_lossy，不按响应头 charset 解码。
# rustls-no-provider：只接入 rustls、不绑定 ring/aws-lc-rs（ADR-016），provider 由下方的
# tls-ring/tls-aws-lc feature 选择后显式注入；rustls-webpki-roots 提供内置根证书（musl
# 静态链接友好）。注：不能用 ureq 的 `rustls` feature——它强制 `rustls/ring`，会让下游
# 与 reqwest(aws-lc-rs) 因 feature 统一而双套编译并拖入 cmake（issue #62）。
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
# rustls：仅用于 provider 选择（tls-ring/tls-aws-lc）与显式注入 ureq（ADR-016）。ureq 已以
# rustls-no-provider 拉入同一 rustls，此处不增依赖体积；default-features = false 避免默认
# 启用 aws-lc-rs（把 provider 选择权完全交给 feature）
rustls = { version = "0.23", default-features = false }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
pretty_assertions = "1.4.1"

[features]
# MCP 服务器（stdio）支持：`worbrow mcp` 子命令；默认启用
default = ["mcp", "tls-ring"]
mcp = ["dep:rmcp"]
# TLS provider 选择（ADR-016，issue #62）：rustls 的 provider feature 只能"加"不能"减"，
# 故由 worbrow 显式暴露，下游可 `default-features = false` 后按需选择，避免与 reqwest 的
# aws-lc-rs 因 feature 统一而双套编译（ring + aws-lc-sys，并拖入 cmake）。
# tls-ring：默认，静态链接友好（musl）；tls-aws-lc：与 reqwest(aws-lc-rs) 对齐；
# tls-none：不捆绑 provider，用进程 `CryptoProvider::install_default` 的默认值，缺失时
# 跳过 HTTP 直抓、回退浏览器（不 panic）。
tls-ring = ["rustls/ring"]
tls-aws-lc = ["rustls/aws-lc-rs"]
tls-none = []

# Debian 打包（`make deb` / CI，cargo-deb 3.x）：发布形态启用 mcp feature
[package.metadata.deb]
maintainer = "noisystreet <10571173+noisystreet@users.noreply.github.com>"
section = "utils"
priority = "optional"
# 运行时需任一浏览器（Chrome/Edge 亦可，故为弱依赖）
recommends = "firefox | firefox-esr"

# 依赖审计：tokio-tungstenite 已被 CDP 后端（drivers/cdp.rs）实际使用，无需 ignore

# 安全基线：依赖树许可与漏洞检查（cargo-deny）
[package.metadata.deny]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

# 编译加速：dev 构建裁剪依赖调试信息（target/debug 体积与增量编译时间大头是依赖 DWARF）。
# 需要单步调试进依赖时，临时删除本段或改回 debug = true 即可。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
